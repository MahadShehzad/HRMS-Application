<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <title>PeopleCore HRMS</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="PeopleCore — Human Resource Management System">
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Apply the saved theme before first paint (prevents a light/dark flash) -->
  <script>
    (function () {
      try {
        var pref = localStorage.getItem('hrms.theme') || 'light';
        var dark = pref === 'dark' || (pref === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-bs-theme', dark ? 'dark' : 'light');
      } catch (e) {}
    })();
  </script>

  <!-- Splash screen styles: inlined so they render before the app bundle loads -->
  <style>
    #app-splash {
      position: fixed; inset: 0; z-index: 9999;
      display: grid; place-items: center;
      background: radial-gradient(1200px 600px at 50% 40%, #1e293b 0%, #0f172a 60%, #0b1120 100%);
      color: #e2e8f0; font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
      transition: opacity .35s ease, visibility .35s ease;
    }
    #app-splash.is-hidden { opacity: 0; visibility: hidden; }
    .splash-inner { display: flex; flex-direction: column; align-items: center; gap: 1.25rem; }
    .splash-logo { width: 72px; height: 72px; }
    .splash-logo .ring { fill: none; stroke: #4361ee; stroke-width: 4; stroke-linecap: round;
      stroke-dasharray: 220; stroke-dashoffset: 220; animation: splash-draw 1.1s cubic-bezier(.65,0,.35,1) forwards; }
    .splash-logo .p1, .splash-logo .p2, .splash-logo .p3 { transform-origin: center; transform-box: fill-box;
      opacity: 0; animation: splash-pop .45s cubic-bezier(.2,.8,.2,1.4) forwards; }
    .splash-logo .p1 { fill: #4361ee; animation-delay: .45s; }
    .splash-logo .p2 { fill: #7c93ff; animation-delay: .6s; }
    .splash-logo .p3 { fill: #a5b4fc; animation-delay: .75s; }
    .splash-name { font-size: 1.25rem; font-weight: 600; letter-spacing: .02em; opacity: 0;
      animation: splash-fade .5s ease .5s forwards; }
    .splash-name span { color: #7c93ff; }
    .splash-bar { width: 160px; height: 3px; border-radius: 3px; background: rgba(148,163,184,.18); overflow: hidden; }
    .splash-bar::after { content: ''; display: block; height: 100%; width: 40%; border-radius: inherit;
      background: linear-gradient(90deg, #4361ee, #a5b4fc); animation: splash-slide 1.1s ease-in-out infinite; }
    .splash-hint { font-size: .75rem; color: #64748b; letter-spacing: .08em; text-transform: uppercase; }
    @keyframes splash-draw { to { stroke-dashoffset: 0; } }
    @keyframes splash-pop { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: scale(1); } }
    @keyframes splash-fade { to { opacity: 1; } }
    @keyframes splash-slide { from { transform: translateX(-110%); } to { transform: translateX(260%); } }
    @media (prefers-reduced-motion: reduce) {
      #app-splash *, #app-splash *::after { animation: none !important; opacity: 1 !important; stroke-dashoffset: 0 !important; }
    }
  </style>
</head>
<body>
  <div id="app-splash" role="status" aria-label="Loading application">
    <div class="splash-inner">
      <svg class="splash-logo" viewBox="0 0 80 80" aria-hidden="true">
        <circle class="ring" cx="40" cy="40" r="34" />
        <circle class="p1" cx="40" cy="30" r="8" />
        <circle class="p2" cx="25" cy="46" r="6.5" />
        <circle class="p3" cx="55" cy="46" r="6.5" />
        <path class="p1" d="M27 58c2-8 7-12 13-12s11 4 13 12z" />
      </svg>
      <div class="splash-name">People<span>Core</span></div>
      <div class="splash-bar"></div>
      <div class="splash-hint">Loading workspace</div>
    </div>
  </div>
  <app-root></app-root>
</body>
</html>
